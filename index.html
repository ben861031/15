function parseSmartImport(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    const records = [];
    
    // Check if it's standard TSV
    const tsvLines = lines.filter(l => l.split('\t').length >= 3);
    
    if (tsvLines.length >= Math.max(1, lines.length / 2)) {
        let docNoIdx = 0, refNoIdx = 2, deptIdx = 4, typeIdx = -1, subjIdx = -1;
        const header = lines[0].split('\t');
        const hDoc = header.findIndex(h => h.includes('收發文號'));
        const hRef = header.findIndex(h => h.includes('文字號'));
        const hDept = header.findIndex(h => h.includes('部門') || h.includes('單位'));
        const hType = header.findIndex(h => h.includes('文別'));
        const hSubj = header.findIndex(h => h.includes('主旨'));
        
        if (hDoc !== -1) docNoIdx = hDoc;
        if (hRef !== -1) refNoIdx = hRef;
        if (hDept !== -1) deptIdx = hDept;
        if (hType !== -1) typeIdx = hType;
        if (hSubj !== -1) subjIdx = hSubj;
        
        for (let i = (hDoc !== -1 ? 1 : 0); i < lines.length; i++) {
            const cells = lines[i].split('\t');
            if (cells.length < 2) continue;
            const docNo = (cells[docNoIdx] || '').trim();
            if (!/^[a-zA-Z0-9]{10}$/.test(docNo)) continue;
            
            let dept = (cells[deptIdx] || cells[cells.length-1] || '').trim();
            if (dept === '水利防災部') dept = '水利部';
            if (!dept) dept = '未分類';
            
            let docType = typeIdx !== -1 ? (cells[typeIdx] || '').trim() : '';
            let subject = subjIdx !== -1 ? (cells[subjIdx] || '').trim() : '';
            
            records.push({ docNo, docRef: (cells[refNoIdx] || '').trim(), dept, docType, subject });
        }
    } else {
        // Heuristic block parsing for web page copy
        let currentRecord = null;
        for (let i = 0; i < text.split(/\r?\n/).length; i++) {
            const rawLine = text.split(/\r?\n/)[i];
            const line = rawLine.trim();
            if (/^[a-zA-Z0-9]{10}$/.test(line)) {
                if (currentRecord) records.push(currentRecord);
                currentRecord = { docNo: line, lines: [], rawLines: [] };
            } else if (currentRecord) {
                currentRecord.lines.push(line);
                currentRecord.rawLines.push(rawLine);
            }
        }
        if (currentRecord) records.push(currentRecord);
        
        for (let i = 0; i < records.length; i++) {
            const rec = records[i];
            const fullRaw = rec.rawLines.join('\n');
            const tabParts = fullRaw.split('\t');
            let dept = "未分類";
            let subject = "";
            
            if (tabParts.length > 1) {
                dept = tabParts.pop().trim();
                let beforeLastTab = tabParts.pop() || '';
                let linesBeforeTab = beforeLastTab.split('\n');
                subject = (linesBeforeTab[linesBeforeTab.length - 1] || '').trim();
            }
            if (dept === '水利防災部') dept = '水利部';
            
            let refNo = "";
            let foundRef = rec.lines.find(l => l.includes('字第') && l.includes('號'));
            if (foundRef) {
                refNo = foundRef;
            } else if (rec.lines.length >= 3) {
                refNo = rec.lines[2]; 
            }
            
            let docType = "";
            if (rec.lines.length > 0) {
                docType = rec.lines[0].trim();
                if (/^\d{4}-\d{2}-\d{2}$/.test(docType) || docType.includes('字第')) {
                    docType = '';
                }
            }
            
            records[i] = { docNo: rec.docNo, docRef: refNo, dept: dept, docType: docType, subject: subject };
        }
    }
    return records;
}

function executeSmartImport() {
    const mode = document.getElementById('smartMode').value;
    const yearStr = document.getElementById('smartYear').value;
    const month = parseInt(document.getElementById('smartMonth').value, 10);
    const year = parseInt(yearStr.replace('年', ''), 10);
    
    if (!mode || !year || !month || smartParsedData.length === 0) return;
    
    Swal.fire({
        title: '正在匯入資料...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });
    
    setTimeout(() => {
        const existingKeys = new Set(data.map(d => `${d.mode}_${d.docNo}`));
        let addedCount = 0;
        let duplicateCount = 0;
        let skippedUCount = 0;
        let duplicateList = [];
        let skippedUList = [];
        
        const now = new Date();
        const importTimeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        for (const rec of smartParsedData) {
            if (mode === '收文' && rec.docNo.charAt(3) === 'U') {
                skippedUCount++;
                skippedUList.push(rec.docNo);
                continue;
            }
            const key = `${mode}_${rec.docNo}`;
            if (existingKeys.has(key)) {
                duplicateCount++;
                duplicateList.push(rec.docNo);
                continue;
            }
            data.push({
                mode: mode,
                docNo: rec.docNo,
                docType: rec.docType || '',
                docRef: rec.docRef || '',
                subject: rec.subject || '',
                dept: rec.dept,
                uploadYear: year,
                uploadMonth: month,
                importTime: importTimeStr
            });
            addedCount++;
        }
        
        closeSmartImportModal();
        
        if (addedCount > 0) {
            saveDocDataToLocal();
            syncDataToCloud();
            setFileInfo(mode, '智慧匯入 (剪貼簿)', importTimeStr);
            init(); // Re-initialize to update filters and stats fully
            
            let msgHtml = `成功新增: <b class="text-green-600">${addedCount}</b> 筆<br>重複略過: <b class="text-slate-500">${duplicateCount}</b> 筆<br>包含U碼: <b class="text-orange-500">${skippedUCount}</b> 筆`;
            if (duplicateList.length > 0 || skippedUList.length > 0) {
                msgHtml += `<div class="mt-4 text-left text-xs bg-slate-50 p-3 rounded-xl border border-slate-200 max-h-40 overflow-y-auto space-y-2">`;
                if (skippedUList.length > 0) {
                    msgHtml += `<div><div class="text-orange-600 font-bold mb-1">【略過 - U碼收文】</div><div class="text-slate-600 font-mono tracking-wider break-words">${skippedUList.join(', ')}</div></div>`;
                }
                if (duplicateList.length > 0) {
                    msgHtml += `<div><div class="text-slate-600 font-bold mb-1">【略過 - 重複匯入】</div><div class="text-slate-500 font-mono tracking-wider break-words">${duplicateList.join(', ')}</div></div>`;
                }
                msgHtml += `</div>`;
            }
            
            Swal.fire({
                icon: 'success',
                title: '匯入成功！',
                html: msgHtml,
                confirmButtonColor: '#14a9a8'
            });
        } else {
            let msgHtml = `重複略過: <b class="text-slate-500">${duplicateCount}</b> 筆<br>包含U碼: <b class="text-orange-500">${skippedUCount}</b> 筆`;
            if (duplicateList.length > 0 || skippedUList.length > 0) {
                msgHtml += `<div class="mt-4 text-left text-xs bg-slate-50 p-3 rounded-xl border border-slate-200 max-h-40 overflow-y-auto space-y-2">`;
                if (skippedUList.length > 0) {
                    msgHtml += `<div><div class="text-orange-600 font-bold mb-1">【略過 - U碼收文】</div><div class="text-slate-600 font-mono tracking-wider break-words">${skippedUList.join(', ')}</div></div>`;
                }
                if (duplicateList.length > 0) {
                    msgHtml += `<div><div class="text-slate-600 font-bold mb-1">【略過 - 重複匯入】</div><div class="text-slate-500 font-mono tracking-wider break-words">${duplicateList.join(', ')}</div></div>`;
                }
                msgHtml += `</div>`;
            }
            
            Swal.fire({
                icon: 'info',
                title: '沒有新增資料',
                html: msgHtml,
                confirmButtonColor: '#14a9a8'
            });
        }
    }, 500);
}
</script>

</body>
</html>
