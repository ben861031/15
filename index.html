<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收發文量分析平台 - 優化版</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<style>
body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f1f5f9;
}
.sortable:hover {
    cursor: pointer;
    background-color: #334155;
}
@media print {
    body {
        background: white !important;
    }
        .no-print {
        display: none !important;
    }
    .capture-mode th, .capture-mode td {
        text-align: center !important;
        vertical-align: middle !important;
    }
    .shadow, .shadow-lg {
        box-shadow: none !important;
    }
    .rounded-3xl {
        border-radius: 8px !important;
    }
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .overflow-auto {
        overflow: visible !important;
        max-height: none !important;
    }
    #statsPage {
        display: block !important;
    }
    canvas {
        max-width: 100% !important;
        page-break-inside: avoid;
    }
    .sticky {
        position: static !important;
    }
    tr {
        page-break-inside: avoid;
    }
}
</style>
</head>
<body class="min-h-screen text-slate-800 bg-slate-50">
<!-- Toast 通知容器 -->
<div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

<!-- 登入頁面 -->
<div id="loginPage" class="min-h-screen hidden items-center justify-center bg-gradient-to-br from-[#e6edf8] to-[#f4f7fb] p-4">
    <div class="bg-white rounded-[24px] shadow-2xl p-10 w-full max-w-[360px] flex flex-col items-center relative overflow-hidden">
        <!-- 裝飾用光暈 -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-teal-50 rounded-full blur-3xl opacity-60"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-teal-50 rounded-full blur-3xl opacity-60"></div>
        
        <!-- Icon -->
        <div class="bg-teal-50 text-teal-600 rounded-full w-20 h-20 flex items-center justify-center mb-5 z-10">
            <i data-lucide="user" class="w-10 h-10"></i>
        </div>
        <!-- Title -->
        <h2 class="text-xl font-bold text-slate-800 mb-8 tracking-wide z-10">收發文量分析平台</h2>
        
        <!-- Form -->
        <div class="w-full space-y-4 z-10">
            <input type="text" id="empId" placeholder="員工編號" class="w-full border border-slate-200 rounded-full px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#14a9a8]/50 focus:border-transparent transition-all placeholder:text-slate-400">
            <input type="password" id="empPwd" placeholder="密碼" class="w-full border border-slate-200 rounded-full px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#14a9a8]/50 focus:border-transparent transition-all placeholder:text-slate-400" onkeypress="if(event.key === 'Enter') handleLogin()">
            <button onclick="handleLogin()" class="w-full bg-[#14a9a8] hover:bg-teal-600 text-white rounded-full py-3 text-sm font-semibold shadow-md shadow-teal-200/50 transition-all mt-4 transform hover:scale-[1.02] active:scale-95">登入</button>
        </div>
    </div>
</div>

<!-- 系統上方導覽列 -->
<nav id="mainNav" class="bg-[#14a9a8] text-white shadow-md sticky top-0 z-50 no-print hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-14">
            <!-- 左側：Logo與系統名稱及選單 -->
            <div class="flex items-center gap-5 sm:gap-8">
                <div class="flex items-center gap-2">
                    <i data-lucide="bar-chart-2" class="w-[22px] h-[22px] text-white"></i>
                    <span class="text-[20px] font-normal tracking-wide">收發文量分析平台</span>
                </div>
                
                <!-- 進階功能下拉選單 -->
                <div class="relative group hidden sm:block">
                    <button class="flex items-center gap-1 text-white/80 hover:text-white transition-colors font-normal text-[15px]">
                        <span>系統選單</span>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 ml-0.5"></i>
                    </button>
                    <!-- Hover Dropdown Menu -->
                    <div class="absolute left-0 mt-3 w-48 bg-white rounded-xl shadow-xl border border-slate-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 origin-top-left">
                        <div class="p-1.5 text-slate-800">
                            <button onclick="openMailSettings()" class="w-full text-left flex items-center px-3 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors">
                                <i data-lucide="mail" class="w-4 h-4 mr-2.5"></i> 信件設定
                            </button>
                            <div class="h-px bg-slate-100 my-1 mx-2"></div>
                            <button onclick="exportJson()" class="w-full text-left flex items-center px-3 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors">
                                <i data-lucide="download" class="w-4 h-4 mr-2.5"></i> 匯出備份 (JSON)
                            </button>
                            <button onclick="document.getElementById('jsonFileInput').click()" class="w-full text-left flex items-center px-3 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors">
                                <i data-lucide="upload" class="w-4 h-4 mr-2.5"></i> 匯入還原 (JSON)
                            </button>
                            <div class="h-px bg-slate-100 my-1 mx-2"></div>
                            <button onclick="resetData()" class="w-full text-left flex items-center px-3 py-2 text-sm text-red-600 hover:bg-red-50 hover:text-red-700 rounded-lg transition-colors font-medium">
                                <i data-lucide="trash-2" class="w-4 h-4 mr-2.5"></i> 清除系統資料
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右側：上傳按鈕與登出 -->
            <div class="flex items-center gap-1.5 sm:gap-4">
                <button onclick="document.getElementById('incomingFile').click()" class="flex items-center gap-1.5 px-2 py-1 text-white/80 hover:text-white transition-colors text-[15px] font-normal">
                    <i data-lucide="upload" class="w-[18px] h-[18px] hidden sm:block"></i>
                    <span>收文上傳</span>
                </button>
                <button onclick="document.getElementById('outgoingFile').click()" class="flex items-center gap-1.5 px-2 py-1 text-white/80 hover:text-white transition-colors text-[15px] font-normal">
                    <i data-lucide="upload" class="w-[18px] h-[18px] hidden sm:block"></i>
                    <span>發文上傳</span>
                </button>
                <button onclick="forceSyncWithCloud()" class="flex items-center gap-1.5 px-2 py-1 text-white/80 hover:text-white transition-colors text-[15px] font-normal">
                    <i data-lucide="refresh-cw" class="w-[18px] h-[18px] hidden sm:block"></i>
                    <span>手動同步</span>
                </button>
                
                <!-- 使用者個人檔案下拉選單 -->
                <div class="relative group hidden sm:block">
                    <button class="flex items-center gap-1.5 px-2 py-1 text-white/90 hover:text-white transition-colors font-normal text-[15px]">
                        <i data-lucide="user" class="w-[18px] h-[18px]"></i>
                        <span id="navUserName">載入中...</span>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 ml-0.5 opacity-70"></i>
                    </button>
                    <!-- Hover Dropdown Menu -->
                    <div class="absolute right-0 mt-3 w-40 bg-white rounded-xl shadow-xl border border-slate-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 origin-top-right">
                        <div class="p-1.5 text-slate-800">
                            <button onclick="logout()" class="w-full text-left flex items-center px-3 py-2 text-sm text-slate-700 hover:bg-red-50 hover:text-red-600 rounded-lg transition-colors font-medium">
                                <i data-lucide="log-out" class="w-4 h-4 mr-2.5"></i> 登出系統
                            </button>
                        </div>
                    </div>
                </div>
                
                <input type="file" id="incomingFile" accept=".xlsx,.xls" class="hidden">
                <input type="file" id="outgoingFile" accept=".xlsx,.xls" class="hidden">
                <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="importJson(event)">
            </div>
        </div>
    </div>
</nav>

<!-- 系統主畫面 -->
<div id="mainApp" class="p-4 sm:p-6 hidden">
<div class="max-w-7xl mx-auto">

    <!-- 概覽數字區塊 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 no-print">
        <div class="bg-gradient-to-br from-white to-slate-50 border border-slate-100 rounded-3xl shadow-sm p-5 transition-all hover:shadow-md hover:-translate-y-1 group">
            <div class="flex items-center justify-between mb-1">
                <div class="text-slate-500 font-semibold text-sm">總公文量</div>
                <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-[#14a9a8]/10 group-hover:text-[#14a9a8] transition-colors"><i data-lucide="file-stack" class="w-4 h-4"></i></div>
            </div>
            <div id="totalDocs" class="text-3xl font-bold text-slate-800">0</div>
        </div>
        <div class="bg-gradient-to-br from-white to-slate-50 border border-slate-100 rounded-3xl shadow-sm p-5 transition-all hover:shadow-md hover:-translate-y-1 group">
            <div class="flex items-center justify-between mb-1">
                <div class="text-slate-500 font-semibold text-sm">部門數</div>
                <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-[#14a9a8]/10 group-hover:text-[#14a9a8] transition-colors"><i data-lucide="building-2" class="w-4 h-4"></i></div>
            </div>
            <div id="deptCount" class="text-3xl font-bold text-slate-800">0</div>
        </div>
        <div class="bg-gradient-to-br from-white to-slate-50 border border-slate-100 rounded-3xl shadow-sm p-5 transition-all hover:shadow-md hover:-translate-y-1 group">
            <div class="flex items-center justify-between mb-1">
                <div class="text-slate-500 font-semibold text-sm">收文</div>
                <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-[#14a9a8]/10 group-hover:text-[#14a9a8] transition-colors"><i data-lucide="inbox" class="w-4 h-4"></i></div>
            </div>
            <div id="incomingCount" class="text-3xl font-bold text-slate-800">0</div>
        </div>
        <div class="bg-gradient-to-br from-white to-slate-50 border border-slate-100 rounded-3xl shadow-sm p-5 transition-all hover:shadow-md hover:-translate-y-1 group">
            <div class="flex items-center justify-between mb-1">
                <div class="text-slate-500 font-semibold text-sm">發文</div>
                <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-[#14a9a8]/10 group-hover:text-[#14a9a8] transition-colors"><i data-lucide="send" class="w-4 h-4"></i></div>
            </div>
            <div id="outgoingCount" class="text-3xl font-bold text-slate-800">0</div>
        </div>
    </div>

    <!-- 篩選與匯出區塊 -->
    <div class="bg-white rounded-3xl shadow p-5 mb-6 no-print">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
            <div>
                <label class="font-semibold text-sm">報表月份</label>
                <div class="flex gap-2 mt-2">
                    <select id="reportYear" class="w-1/2 border border-slate-200 rounded-2xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#14a9a8]/50 bg-white">
                        <option value="">年度</option>
                        <option value="112年">112年</option>
                        <option value="113年">113年</option>
                        <option value="114年">114年</option>
                        <option value="115年">115年</option>
                        <option value="116年">116年</option>
                        <option value="117年">117年</option>
                        <option value="118年">118年</option>
                    </select>
                    <select id="reportMonth" class="w-1/2 border border-slate-200 rounded-2xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-[#14a9a8]/50 bg-white">
                        <option value="">月份</option>
                        <option value="1月份">1月</option>
                        <option value="2月份">2月</option>
                        <option value="3月份">3月</option>
                        <option value="4月份">4月</option>
                        <option value="5月份">5月</option>
                        <option value="6月份">6月</option>
                        <option value="7月份">7月</option>
                        <option value="8月份">8月</option>
                        <option value="9月份">9月</option>
                        <option value="10月份">10月</option>
                        <option value="11月份">11月</option>
                        <option value="12月份">12月</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="font-semibold text-sm">部門篩選</label>
                <select id="deptFilter" class="mt-2 w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#14a9a8]/50">
                    <option value="">全部部門</option>
                </select>
            </div>
            <div>
                <label class="font-semibold text-sm">收發文篩選</label>
                <select id="modeFilter" class="mt-2 w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#14a9a8]/50">
                    <option value="">全部</option>
                    <option value="收文">收文</option>
                    <option value="發文">發文</option>
                </select>
            </div>
            <div>
                <label class="font-semibold text-sm">資料維護</label>
                <div class="flex gap-2 mt-2">
                    <button onclick="checkDataAnomalies()" class="w-1/2 flex items-center justify-center bg-sky-50 hover:bg-sky-100 text-sky-700 rounded-2xl py-3 font-semibold transition-colors text-sm border border-sky-200 hover:border-sky-300">
                        <i data-lucide="clipboard-check" class="w-4 h-4 mr-1"></i> 查核
                    </button>
                    <button onclick="showBatchDeleteModal()" class="w-1/2 flex items-center justify-center bg-red-50 hover:bg-red-100 text-red-600 rounded-2xl py-3 font-semibold transition-colors text-sm border border-red-200 hover:border-red-300">
                        <i data-lucide="folder-minus" class="w-4 h-4 mr-1"></i> 刪除
                    </button>
                </div>
            </div>
            <div>
                <label class="font-semibold text-sm">進階功能</label>
                <div class="flex gap-2 mt-2">
                    <button onclick="openSmartImportModal()" class="w-1/2 flex items-center justify-center bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-2xl py-3 font-semibold transition-colors text-sm border border-indigo-200 hover:border-indigo-300" title="智慧匯入 (從剪貼簿)">
                        <i data-lucide="sparkles" class="w-4 h-4 mr-1"></i> 智慧匯入
                    </button>
                    <button onclick="exportEmailReport()" class="w-1/2 flex items-center justify-center bg-teal-50 hover:bg-teal-100 text-[#14a9a8] rounded-2xl py-3 font-semibold transition-colors text-sm border border-teal-200 hover:border-teal-300">
                        <i data-lucide="mail" class="w-4 h-4 mr-1"></i> 信件
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 部門統計頁 -->
    <div id="statsPage">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div id="deptTableCard" class="bg-white rounded-3xl shadow p-5">
                <div class="flex flex-col gap-4 mb-4 w-full">
                    <h2 class="text-lg xl:text-xl font-bold flex items-center text-slate-800">
                        <i data-lucide="building-2" class="w-6 h-6 mr-2 text-slate-700 shrink-0"></i>
                        <span class="leading-snug"><span class="dynamic-period text-slate-900 mr-1"></span>各部門收發文統計</span>
                    </h2>
                    <div class="flex items-center gap-2 flex-wrap no-print justify-end w-full" data-html2canvas-ignore="true">
                        <button onclick="exportToPDF()" class="flex items-center bg-white hover:bg-slate-50 text-slate-600 hover:text-red-500 border border-slate-200 hover:border-red-500/30 px-3 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all active:scale-95" title="匯出 PDF">
                            <i data-lucide="file-down" class="w-4 h-4 sm:mr-1"></i> <span class="hidden sm:inline">匯出 PDF</span>
                        </button>
                        <button onclick="copyDeptTable()" class="flex items-center bg-white hover:bg-slate-50 text-slate-600 hover:text-[#14a9a8] border border-slate-200 hover:border-[#14a9a8]/30 px-3 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all active:scale-95" title="複製表格">
                            <i data-lucide="copy" class="w-4 h-4 sm:mr-1"></i> <span class="hidden sm:inline">複製表格</span>
                        </button>
                        <button onclick="exportDeptStats()" class="flex items-center bg-white hover:bg-slate-50 text-slate-600 hover:text-teal-600 border border-slate-200 hover:border-teal-600/30 px-3 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all active:scale-95" title="匯出統計 (Excel)">
                            <i data-lucide="download" class="w-4 h-4 sm:mr-1"></i> <span class="hidden sm:inline">匯出統計</span>
                        </button>
                        <button onclick="exportAnnualMonthlyReport()" class="flex items-center bg-white hover:bg-slate-50 text-slate-600 hover:text-teal-600 border border-slate-200 hover:border-teal-600/30 px-3 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all active:scale-95" title="匯出年度月報表 (Excel)">
                            <i data-lucide="table-2" class="w-4 h-4 sm:mr-1"></i> <span class="hidden sm:inline">年度月報表</span>
                        </button>
                    </div>
                </div>
                <div class="overflow-auto max-h-[60vh]">
                    <table id="deptTable" class="w-full text-sm border-collapse">
                        <thead class="bg-white/90 backdrop-blur-sm text-slate-500 font-semibold tracking-widest text-[14px] border-b-2 border-slate-200 sticky top-0 z-20">
                            <tr>
                                <th class="px-4 sm:px-6 py-3 text-left"><div class="cell-content" style="position: relative;">部門</div></th>
                                <th class="px-4 py-3 text-center"><div class="cell-content" style="position: relative;">收文</div></th>
                                <th class="px-4 py-3 text-center"><div class="cell-content" style="position: relative;">發文</div></th>
                                <th class="px-4 py-3 text-center"><div class="cell-content" style="position: relative;">小計</div></th>
                            </tr>
                        </thead>
                        <tbody id="deptStatsBody"></tbody>
                        <tfoot id="deptStatsFoot" class="bg-white/90 backdrop-blur-sm sticky bottom-0 border-t-2 border-slate-200 z-20"></tfoot>
                    </table>
                </div>
            </div>
            
            <div class="bg-white rounded-3xl shadow p-5 flex flex-col min-h-[400px]">
                <div class="flex flex-col gap-4 mb-4 w-full">
                    <h2 class="text-lg xl:text-xl font-bold flex items-center text-slate-800">
                        <i data-lucide="bar-chart-3" class="w-6 h-6 mr-2 text-slate-700 shrink-0"></i>
                        <span class="leading-snug"><span class="dynamic-period text-slate-900 mr-1"></span>部門公文量分布</span>
                    </h2>
                    <div class="flex items-center gap-2 flex-wrap no-print justify-end w-full" data-html2canvas-ignore="true">
                        <!-- 切換圖表類型 (Segmented Control) -->
                        <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                            <button onclick="changeChartType('stackedBar')" id="btnBar" class="px-3 py-1.5 rounded-lg bg-white shadow-sm text-sm font-bold text-slate-700 transition-all">長條圖</button>
                            <button onclick="changeChartType('line')" id="btnLine" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all">折線圖</button>
                            <button onclick="changeChartType('pie')" id="btnPie" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all">圓餅圖</button>
                        </div>
                        <button onclick="copyChart()" class="flex items-center bg-white hover:bg-slate-50 text-slate-600 hover:text-[#14a9a8] border border-slate-200 hover:border-[#14a9a8]/30 px-3 py-2 rounded-xl text-sm font-semibold shadow-sm transition-all active:scale-95" title="複製圖表">
                            <i data-lucide="copy" class="w-4 h-4 sm:mr-1"></i> <span class="hidden sm:inline">複製圖表</span>
                        </button>
                    </div>
                </div>
                <div class="w-full relative h-[350px] mt-4">
                    <canvas id="deptChart"></canvas>
                    <div id="chartEmptyState" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10">
                        <i data-lucide="line-chart" class="w-16 h-16 mb-4 text-slate-200"></i>
                        <p class="text-lg font-medium text-slate-500">暫無圖表數據</p>
                        <p class="text-sm mt-1 text-slate-400">請同步雲端資料以自動產生分析圖表</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div> <!-- 結束 mainApp -->

<!-- 信件設定 Modal -->
<div id="mailSettingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="mailSettingsContainer">
        <!-- Header -->

// --- 資料壓縮儲存輔助 ---
function saveDocDataToLocal() {
    try {
        const compressed = LZString.compressToUTF16(JSON.stringify(data));
        localStorage.setItem('docData', compressed);
    } catch (err) {
        console.error("Quota exceeded even with compression or other error", err);
        Swal.fire('儲存失敗', '本機儲存空間不足，部分資料將無法保存在本機（但仍可同步至雲端）。請考慮清空瀏覽器快取。', 'error');
    }
}
function loadDocDataFromLocal() {
    const raw = localStorage.getItem('docData');
    if (!raw) return null;
    try {
        if (raw.startsWith('[')) {
            const parsed = JSON.parse(raw);
            try { localStorage.setItem('docData', LZString.compressToUTF16(raw)); } catch(e){}
            return parsed;
        } else {
            const decomp = LZString.decompressFromUTF16(raw);
            if (!decomp) return null;
            return JSON.parse(decomp);
        }
    } catch (err) {
        console.error("Failed to parse local docData", err);
        return null;
    }
}

function openMailSettings() {
    const modal = document.getElementById('mailSettingsModal');
    const container = document.getElementById('mailSettingsContainer');
    let to = '';
    let cc = '';
    try {
        const saved = localStorage.getItem('mailSettings');
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.to) to = parsed.to;
            if (parsed.cc) cc = parsed.cc;
        }
    } catch(e) {}
    document.getElementById('mailSettingsTo').value = to;
    document.getElementById('mailSettingsCc').value = cc;
    modal.classList.remove('hidden');
    setTimeout(() => {
        container.classList.remove('scale-95', 'opacity-0');
        container.classList.add('scale-100', 'opacity-100');
    }, 10);
}

function closeMailSettings() {
    const modal = document.getElementById('mailSettingsModal');
    const container = document.getElementById('mailSettingsContainer');
    container.classList.remove('scale-100', 'opacity-100');
    container.classList.add('scale-95', 'opacity-0');

        modal.classList.add('hidden');

}

async function saveMailSettings() {
    const to = document.getElementById('mailSettingsTo').value.trim();

            method: 'POST',

            body: JSON.stringify({ action: 'syncSettings', data: settings })
        });
    } catch (err) {
        console.error('Failed to sync settings to cloud', err);
    }
}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbybDB7Amat7sJuvU4LE1XidMVt-RC1jOFNwkdpu62lXXS-e7IspaCvCaO3hO2vfnleI7w/exec';

async function handleLogin() {
    const id = document.getElementById('empId').value.trim();
    const pwd = document.getElementById('empPwd').value.trim();
    if (!id || !pwd) {
        showToast('登入失敗', '請輸入員工編號與密碼', 'error');
        return;
    }
    
    const btn = document.querySelector('#loginPage button');
    const originalText = btn.textContent;
    btn.textContent = '驗證中...';
    btn.disabled = true;

    try {
        const response = await fetch(`${GAS_URL}?action=login&id=${encodeURIComponent(id)}&pwd=${encodeURIComponent(pwd)}&_t=${Date.now()}`);
        const result = await response.json();
        
        console.log("Login API Response:", result);
        
        if (result.status === 'success') {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('flex');
            document.getElementById('mainApp').classList.remove('hidden');
            const mainNav = document.getElementById('mainNav');
            if (mainNav) mainNav.classList.remove('hidden');
            localStorage.setItem('isLoggedIn', 'true');
            if (result.dept && result.name) {
                localStorage.setItem('userDept', result.dept);
                localStorage.setItem('userName', result.name);
                const navUserName = document.getElementById('navUserName');
                if (navUserName) {
                    let displayName = result.name;
                    if (!displayName.startsWith(result.dept)) {
                        displayName = `${result.dept} ${result.name}`;
                    }
                    navUserName.textContent = displayName;
                }
            } else {
                const navUserName = document.getElementById('navUserName');
                if (navUserName) navUserName.textContent = `使用者`;
            }
            showToast('登入成功', result.message, 'success');
            // 本機模式，維持原有的拖曳上傳與暫存邏輯
            // 不自動同步雲端資料
        } else {
            showToast('登入失敗', result.message, 'error');
            btn.textContent = originalText;
            btn.disabled = false;
        }
    } catch (e) {
        showToast('登入失敗', '無法連接到伺服器', 'error');
        btn.textContent = originalText;
        btn.disabled = false;
    }
}

function deduplicateData(dataArray) {
    if (!Array.isArray(dataArray)) return [];
    const seen = new Set();
    return dataArray.filter(item => {
        if (!item || !item.docNo) return false;
        const key = `${item.mode}_${String(item.docNo).trim()}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });
}

async function syncDataToCloud() {
    try {
        // 同步前強制再次去重，確保不將重複資料推上雲端
        data = deduplicateData(data);
        saveDocDataToLocal();

        await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'overwriteData', data: data })
        });
    } catch (err) {
        console.error('Auto sync failed:', err);
    }
}

async function fetchDataFromCloud() {
    if (!GAS_URL) return null;
    try {
        const response = await fetch(`${GAS_URL}?action=getData`, {
            method: 'GET'
        });
        const result = await response.json();
        if (result && result.status === 'success' && Array.isArray(result.data)) {
            if (result.settings) {
                localStorage.setItem('mailSettings', JSON.stringify(result.settings));
            }
            let rawData = result.data;
            let mappedData = [];
            
            if (rawData.length > 0 && Array.isArray(rawData[0])) {
                // 安全正規化標題欄位，去除所有隱藏空白與不可見字元
                const headers = rawData[0].map(h => (typeof h === 'string' ? h.replace(/\s+/g, '').trim() : h));
                const rows = rawData.slice(1);
                
                mappedData = rows.map(row => {
                    let item = {};
                    headers.forEach((h, i) => {
                        if (h) item[h] = row[i];
                    });
                    
                    // 為了防呆，如果找不到完全符合的標題，嘗試模糊比對
                    const getVal = (keys) => {
                        for (let k of keys) {
                            if (item[k] !== undefined) return item[k];
                            // 模糊搜尋
                            const foundKey = Object.keys(item).find(ik => ik && ik.includes(k));
                            if (foundKey) return item[foundKey];
                        }
                        return '';
                    };

                    const rawDocNo = getVal(['docNo', '總收發文號']);
                    return {
                        mode: getVal(['mode', '收發']),
                        docNo: String(rawDocNo).trim(),
                        docType: getVal(['docType', '文別']),
                        docRef: getVal(['docRef', '來(發)文字號']),
                        subject: getVal(['subject', '主旨']),
                        dept: getVal(['dept', '承辦部門']) || '未分類',
                        uploadYear: parseInt(getVal(['uploadYear', '歸屬年份']), 10) || null,
                        uploadMonth: parseInt(getVal(['uploadMonth', '歸屬月份']), 10) || null,
                        importTime: getVal(['importTime', '匯入時間'])
                    };
                }).filter(d => d.docNo); // 確保一定要有文號
                
            } else {
                mappedData = rawData.map(item => {
                    const getVal = (keys) => {
                        for (let k of keys) {
                            if (item[k] !== undefined) return item[k];
                            const foundKey = Object.keys(item).find(ik => ik && ik.includes(k));
                            if (foundKey) return item[foundKey];
                        }
                        return '';
                    };
                    const rawDocNo = getVal(['docNo', '總收發文號']);
                    return {
                        mode: getVal(['mode', '收發']),
                        docNo: String(rawDocNo).trim(),
                        docType: getVal(['docType', '文別']),
                        docRef: getVal(['docRef', '來(發)文字號']),
                        subject: getVal(['subject', '主旨']),
                        dept: getVal(['dept', '承辦部門']) || '未分類',
                        uploadYear: parseInt(getVal(['uploadYear', '歸屬年份']), 10) || null,
                        uploadMonth: parseInt(getVal(['uploadMonth', '歸屬月份']), 10) || null,
                        importTime: getVal(['importTime', '匯入時間'])
                    };
                }).filter(d => d.docNo);
            }
            
            if (mappedData.length === 0 && rawData.length > 1) {
                console.error("Data was fetched but all rows were filtered out due to missing docNo! Headers:", rawData[0]);
                alert("系統抓到了資料，但在解析時發生錯誤（找不到『總收發文號』欄位），請確認 Google Sheets 第一行是否為正確的欄位名稱！");
            }
            
            return mappedData;
        }
    } catch(err) {
        console.error('Cloud fetch failed:', err);
    }
    return null;
}

async function showBatchDeleteModal() {
    const availableYears = [...new Set(data.map(d => d.uploadYear))].filter(y => y).sort((a,b) => b - a);
    const yearOptions = availableYears.map(y => `<option value="${y}">${y}年</option>`).join('');

    const { value: formValues } = await Swal.fire({
        title: '批次刪除資料',
        html: `
            <div class="mb-4 text-sm text-slate-500">請選擇要刪除的年份、月份與公文類型，刪除後將同步覆蓋雲端，<strong class="text-red-500">此操作無法復原</strong>。</div>
            <div class="flex flex-col gap-3">
                <select id="del-year" class="swal2-select !w-full !mx-0 !mt-0 text-sm">
                    <option value="" disabled selected>請選擇年份</option>
                    ${yearOptions}
                </select>
                <select id="del-month" class="swal2-select !w-full !mx-0 !mt-0 text-sm">
                    <option value="" disabled selected>請選擇月份</option>
                    ${Array.from({length: 12}, (_, i) => `<option value="${i + 1}">${i + 1}月</option>`).join('')}
                </select>
                <select id="del-mode" class="swal2-select !w-full !mx-0 !mt-0 text-sm">
                    <option value="" disabled selected>請選擇類型</option>
                    <option value="全部">全部 (收文 + 發文)</option>
                    <option value="收文">僅收文</option>
                    <option value="發文">僅發文</option>
                </select>
            </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: '確認刪除',
        cancelButtonText: '取消',
        confirmButtonColor: '#ef4444',
        preConfirm: () => {
            const year = document.getElementById('del-year').value;
            const month = document.getElementById('del-month').value;
            const mode = document.getElementById('del-mode').value;
            if (!year || !month || !mode) {
                Swal.showValidationMessage('請完整選擇年份、月份與類型！');
            }
            return { year: parseInt(year, 10), month: parseInt(month, 10), mode };
        }
    });

    if (formValues) {
        const { year, month, mode } = formValues;
        const initialLength = data.length;
        
        data = data.filter(d => {
            const matchYear = d.uploadYear === year;
            const matchMonth = d.uploadMonth === month;
            const matchMode = (mode === '全部') || (d.mode === mode);
            if (matchYear && matchMonth && matchMode) return false;
            return true;
        });

        const deletedCount = initialLength - data.length;

        if (deletedCount === 0) {
            Swal.fire('沒有找到資料', `找不到符合條件的公文。`, 'info');
            return;
        }

        saveDocDataToLocal();
        updateOverviewStats();
        renderFilters();
        filterData();

        if (GAS_URL) {
            Swal.fire({
                title: '正在同步至雲端...',
                html: `已刪除 ${deletedCount} 筆公文，正在覆蓋雲端資料庫...`,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'overwriteData', data: data })
                });
                Swal.fire('✅ 刪除與同步完成', `已成功刪除 ${deletedCount} 筆公文並更新雲端`, 'success');
            } catch(e) {
                console.error(e);
                Swal.fire('❌ 同步失敗', `本機已刪除，但無法連線至雲端`, 'error');
            }
        } else {
             Swal.fire('✅ 刪除完成', `已成功刪除 ${deletedCount} 筆公文`, 'success');
        }
    }
}

function checkDataAnomalies() {
    let report = [];
    const yearCounts = {};
    const exactDuplicates = [];
    const partialDuplicates = [];
    const docNoMap = {};

    data.forEach(d => {
        const y = d.uploadYear || '未知年份';
        if (!yearCounts[y]) yearCounts[y] = { incoming: 0, outgoing: 0 };
        if (d.mode === '收文') yearCounts[y].incoming++;
        if (d.mode === '發文') yearCounts[y].outgoing++;
        
        if (!docNoMap[d.docNo]) {
            docNoMap[d.docNo] = [d];
        } else {
            docNoMap[d.docNo].push(d);
        }
    });

    for (const [docNo, items] of Object.entries(docNoMap)) {
        if (items.length > 1) {
            const hasIncoming = items.some(i => i.mode === '收文');
            const hasOutgoing = items.some(i => i.mode === '發文');
            if (hasIncoming && hasOutgoing) {
                partialDuplicates.push(docNo);
            } else {
                exactDuplicates.push(docNo);
            }
        }
    }

    report.push('<b>【各年度公文總數】</b>');
    for (const y of Object.keys(yearCounts).sort((a,b)=>b-a)) {
        report.push(`${y}年: 收文 ${yearCounts[y].incoming} 筆, 發文 ${yearCounts[y].outgoing} 筆`);
    }
    
    report.push('<br><b>【異常偵測】</b>');
    if (exactDuplicates.length > 0) {
        report.push(`<span class="text-red-600 font-bold">發現 ${exactDuplicates.length} 筆完全重複的公文！</span> (這可能是系統早期匯入時沒有防呆，或是手動操作造成的幽靈公文)`);
    } else {
        report.push(`<span class="text-green-600">無發現完全重複的公文。</span>`);
    }

    if (partialDuplicates.length > 0) {
        report.push(`<span class="text-orange-500 font-bold">發現 ${partialDuplicates.length} 筆「同字號但分屬收發文」的公文。</span> (這個在實務上可能是同一份公文的往返，系統已自動為您安全保留)`);
    } else {
        report.push(`<span class="text-green-600">無收發文共用字號的情況。</span>`);
    }

    Swal.fire({
        title: '資料健檢報告',
        html: `<div class="text-left text-sm leading-loose max-h-96 overflow-y-auto p-2 bg-slate-50 rounded-xl border">${report.join('<br>')}</div>`,
        width: '600px',
        showCancelButton: exactDuplicates.length > 0,
        confirmButtonText: exactDuplicates.length > 0 ? '一鍵自動修復 (剔除重複)' : '完成',
        cancelButtonText: '取消',
        confirmButtonColor: exactDuplicates.length > 0 ? '#ef4444' : '#4f46e5'
    }).then((result) => {
        if (result.isConfirmed && exactDuplicates.length > 0) {
            autoFixDataAnomalies();
        }
    });
}

async function autoFixDataAnomalies() {
    Swal.fire({
        title: '正在自動修復資料...',
        html: '系統正在為您剔除重複的公文，並重新覆蓋雲端資料庫。<br>這需要幾秒鐘，請不要關閉網頁。',
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    const uniqueMap = new Map();
    const cleanData = [];
    
    data.forEach(d => {
        const key = `${d.mode}_${d.docNo}`;
        if (!uniqueMap.has(key)) {
            uniqueMap.set(key, true);
            cleanData.push(d);
        }
    });

    const removedCount = data.length - cleanData.length;
    data = cleanData;
    
    saveDocDataToLocal();
    updateOverviewStats();
    renderFilters();
    filterData();

    if (GAS_URL) {
        Swal.fire({
            title: '正在同步修復結果...',
            html: `已剔除 ${removedCount} 筆重複資料，正在覆蓋雲端資料庫...`,
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });
        try {
            await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'overwriteData', data: data })
            });
            Swal.fire('修復成功！', `太棒了！已成功為您剔除 ${removedCount} 筆重複的幽靈公文，並且已經把乾淨的資料「完全同步覆蓋」到 Google Sheets 雲端資料庫了！`, 'success');
        } catch(e) {
            console.error(e);
            Swal.fire('修復完成 (僅本機)', `已剔除 ${removedCount} 筆重複資料，但無法連線至雲端。`, 'warning');
        }
    } else {
        Swal.fire('修復成功', `已成功剔除 ${removedCount} 筆重複資料。`, 'success');
    }
}

function excelDateToJSDate(serial) {
    if (!serial) return '';
    if (!isNaN(serial)) {
        const utc_days = Math.floor(serial - 25569);
        const utc_value = utc_days * 86400;
        const date_info = new Date(utc_value * 1000);
        const year = date_info.getFullYear();
        const month = String(date_info.getMonth() + 1).padStart(2, '0');
        const day = String(date_info.getDate()).padStart(2, '0');
        return `${year}/${month}/${day}`;
    }
    return String(serial);
}

async function handleFile(e, mode, filename) {
    const file = e.target.files[0];
    if (!file) return;

    e.target.value = '';

    const currentYear = new Date().getFullYear() - 1911;

    const { value: formValues } = await Swal.fire({
        title: `匯入${mode}資料`,
        html: `
            <div class="mb-2 text-sm text-slate-500 font-semibold">檔案：${filename}</div>
            <div class="mb-4 text-xs text-slate-400">請指定這些資料要歸檔的年份與月份</div>
            <div class="flex gap-2 justify-center">
                <input id="swal-input1" class="swal2-input !w-1/2 !mx-0 !mt-0" type="number" placeholder="民國年 (例:${currentYear})" value="${currentYear}">
                <select id="swal-input2" class="swal2-select !w-1/2 !mx-0 !mt-0 text-sm">
                    <option value="" disabled selected>月份</option>
                    ${Array.from({length: 12}, (_, i) => `<option value="${i + 1}">${i + 1}月</option>`).join('')}
                </select>
            </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: '確認匯入',
        cancelButtonText: '取消',
        confirmButtonColor: '#4f46e5',
        preConfirm: () => {
            const year = document.getElementById('swal-input1').value;
            const month = document.getElementById('swal-input2').value;
            if (!year || !month) {
                Swal.showValidationMessage('請完整輸入年份與月份！');
            }
            return { year: parseInt(year, 10), month: parseInt(month, 10) };
        }
    });

    if (!formValues) return;
    const { year, month } = formValues;

    Swal.fire({
        title: `正在解析 ${mode} Excel...`,
        html: '資料處理中，請稍候...',
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
            setTimeout(() => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const workbook = XLSX.read(event.target.result, { type: 'binary' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const raw = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                        const existingKeys = new Set(data.map(d => `${d.mode}_${d.docNo}`));
                        let addedCount = 0;
                        let duplicateCount = 0;
                        let skippedUCount = 0;

                        for (let i = 0; i < raw.length; i++) {
                            const row = raw[i];
                            const docNo = String(row['總收發文號'] || '').trim();
                            
                            if (docNo !== '') {
                                // 如果是收文，且第4碼為'U'，則不計入(跳過)
                                if (mode === '收文' && docNo.charAt(3) === 'U') {
                                    skippedUCount++;
                                    continue;
                                }

                                const nextRow = (i + 1 < raw.length && !raw[i+1]['總收發文號']) ? raw[i+1] : {};
                                let topRef = excelDateToJSDate(row['來(發)文字號'] || '');
                                let bottomRef = excelDateToJSDate(nextRow['來(發)文字號'] || '');

                                let parsedDept = String(row['承辦部門'] || row['承辦單位'] || '未分類').trim();
                                if (parsedDept === '水利防災部') parsedDept = '水利部';

                                const key = `${mode}_${docNo}`;
                                if (existingKeys.has(key)) {
                                    duplicateCount++;
                                    continue;
                                }

                                const now = new Date();
                                const importTimeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

                                data.push({
                                    mode: mode,
                                    docNo: docNo,
                                    docType: String(row['文別'] || ''),
                                    docRef: `${topRef} ${bottomRef}`.trim(),
                                    subject: String(row['主旨'] || row['公文主旨'] || ''),
                                    dept: parsedDept,
                                    uploadYear: year,
                                    uploadMonth: month,
                                    importTime: importTimeStr
                                });
                                
                                existingKeys.add(key);
                                addedCount++;
                            }
                        }
                        
                        saveDocDataToLocal();
                        syncDataToCloud();
                        const now = new Date();
                        const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                        
                        setFileInfo(mode, `最新匯入: ${filename} (${year}年${month}月)`, timeStr);
                        
                        let msg = `已成功新增 ${addedCount} 筆資料`;
                        if (duplicateCount > 0 || skippedUCount > 0) {
                            msg = `新增 ${addedCount} 筆資料`;
                            if (duplicateCount > 0) msg += `\n(忽略 ${duplicateCount} 筆重複)`;
                            if (skippedUCount > 0) msg += `\n(跳過 ${skippedUCount} 筆 U 字軌部門收文)`;
                        }
                        
                        Swal.close();
                        showToast('匯入完成', msg, 'success');
                        
                        init();
                    } catch(err) {
                        Swal.close();
                        showToast('讀取失敗', '請確認檔案格式是否正確', 'error');
                        console.error(err);
                    }
                };
                reader.readAsBinaryString(file);
            }, 100);
        }
    });
}

function init() {
    updateOverviewStats();
    renderFilters();
    filterData();
}

function updateOverviewStats() {
    // 判斷目前是否有啟用任何篩選條件
    const deptVal = document.getElementById('deptFilter')?.value;
    const modeVal = document.getElementById('modeFilter')?.value;
    const yearVal = document.getElementById('reportYear')?.value;
    const monthVal = document.getElementById('reportMonth')?.value;
    const isFiltered = deptVal || modeVal || yearVal || monthVal;

    // 如果有篩選，就顯示篩選後的數字；如果沒有篩選，就顯示全部總數
    const targetData = isFiltered ? filteredData : data;

    document.getElementById('totalDocs').textContent = targetData.length.toLocaleString();
    document.getElementById('deptCount').textContent = new Set(targetData.map(x => x.dept)).size.toLocaleString();
    document.getElementById('incomingCount').textContent = targetData.filter(x => x.mode === '收文').length.toLocaleString();
    document.getElementById('outgoingCount').textContent = targetData.filter(x => x.mode === '發文').length.toLocaleString();
}

function renderFilters() {
    const currentDept = deptFilter.value;
    deptFilter.innerHTML = '<option value="">全部部門</option>';
    const depts = [...new Set(data.map(x => x.dept))].sort();
    depts.forEach(dept => {
        const option = document.createElement('option');
        option.value = dept;
        option.textContent = dept;
        deptFilter.appendChild(option);
    });
    if (depts.includes(currentDept)) deptFilter.value = currentDept;
}

function filterData() {
    const dept = deptFilter.value;
    const mode = modeFilter.value;
    const yearVal = document.getElementById('reportYear').value;
    const monthVal = document.getElementById('reportMonth').value;
    
    let targetYear = yearVal ? parseInt(yearVal.replace('年', ''), 10) : null;
    let targetMonth = monthVal ? parseInt(monthVal.replace('月份', ''), 10) : null;

    filteredData = data.filter(item => {
        let matchYear = targetYear !== null ? (item.uploadYear === targetYear || item.uploadYear === targetYear + 1911) : true;
        let matchMonth = targetMonth !== null ? (item.uploadMonth === targetMonth) : true;
        return (!dept || item.dept === dept) && (!mode || item.mode === mode) && matchYear && matchMonth;
    });

    updateOverviewStats();
    renderDeptStatsAndChart();
}

function renderDeptStatsAndChart() {
    const stats = {};
    let totalIncoming = 0;
    let totalOutgoing = 0;
    const chartEmptyState = document.getElementById('chartEmptyState');
    
    filteredData.forEach(item => {
        if (!stats[item.dept]) stats[item.dept] = { incoming: 0, outgoing: 0 };
        if (item.mode === '收文') { stats[item.dept].incoming++; totalIncoming++; }
        if (item.mode === '發文') { stats[item.dept].outgoing++; totalOutgoing++; }
    });

    const sortedStats = Object.entries(stats).sort((a, b) => (b[1].incoming + b[1].outgoing) - (a[1].incoming + a[1].outgoing));

    if (sortedStats.length === 0) {
        document.getElementById('deptStatsBody').innerHTML = `<tr><td colspan="4" class="px-4 py-16 text-center border-b">
            <div class="flex flex-col items-center justify-center text-slate-400">
                <i data-lucide="bar-chart-2" class="w-16 h-16 mb-4 text-slate-200"></i>
                <p class="text-lg font-medium text-slate-500">暫無統計數據</p>
            </div>
        </td></tr>`;
        document.getElementById('deptStatsFoot').innerHTML = '';
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        if (chartEmptyState) chartEmptyState.classList.remove('hidden');
    } else {
        if (chartEmptyState) chartEmptyState.classList.add('hidden');
        document.getElementById('deptStatsBody').innerHTML = sortedStats.map(([dept, val]) => `
            <tr class="border-b border-slate-100 hover:bg-slate-100/50 even:bg-slate-50/70 transition-colors">
                <td class="px-4 sm:px-6 py-3.5 font-medium text-slate-700 text-left tracking-wide"><div class="cell-content" style="position: relative;">${dept}</div></td>
                <td class="px-4 py-3.5 text-slate-600 font-normal text-center"><div class="cell-content" style="position: relative;">${val.incoming.toLocaleString()}</div></td>
                <td class="px-4 py-3.5 text-slate-600 font-normal text-center"><div class="cell-content" style="position: relative;">${val.outgoing.toLocaleString()}</div></td>
                <td class="px-4 py-3.5 font-semibold text-slate-900 text-center"><div class="cell-content" style="position: relative;">${(val.incoming + val.outgoing).toLocaleString()}</div></td>
            </tr>
        `).join('');

        document.getElementById('deptStatsFoot').innerHTML = `
            <tr class="text-slate-700">
                <td class="px-4 sm:px-6 py-3.5 font-bold text-left tracking-widest"><div class="cell-content" style="position: relative;">全公司總計</div></td>
                <td class="px-4 py-3.5 font-semibold text-slate-600 text-center"><div class="cell-content" style="position: relative;">${totalIncoming.toLocaleString()}</div></td>
                <td class="px-4 py-3.5 font-semibold text-slate-600 text-center"><div class="cell-content" style="position: relative;">${totalOutgoing.toLocaleString()}</div></td>
                <td class="px-4 py-3.5 font-bold text-slate-900 text-center text-base"><div class="cell-content" style="position: relative;">${(totalIncoming + totalOutgoing).toLocaleString()}</div></td>
            </tr>
        `;
        renderChart(sortedStats);
    }
    lucide.createIcons();
}

function renderChart(sortedStats) {
    const topDepts = sortedStats.slice(0, 15);
    const labels = topDepts.map(s => s[0]);
    const incomingData = topDepts.map(s => s[1].incoming);
    const outgoingData = topDepts.map(s => s[1].outgoing);
    const totalData = topDepts.map(s => s[1].incoming + s[1].outgoing);
    const isStacked = chartType === 'stackedBar';
    const configType = chartType === 'line' ? 'line' : (chartType === 'pie' ? 'doughnut' : 'bar');

    const ctx = document.getElementById('deptChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    let datasets = [];
    if (chartType === 'pie') {
        datasets = [{
            label: '總數量',
            data: totalData,
            backgroundColor: [
                'rgba(59, 130, 246, 0.8)', 'rgba(16, 185, 129, 0.8)', 'rgba(245, 158, 11, 0.8)', 'rgba(239, 68, 68, 0.8)', 'rgba(139, 92, 246, 0.8)',
                'rgba(6, 182, 212, 0.8)', 'rgba(249, 115, 22, 0.8)', 'rgba(236, 72, 153, 0.8)', 'rgba(132, 204, 22, 0.8)', 'rgba(20, 184, 166, 0.8)',
                'rgba(99, 102, 241, 0.8)', 'rgba(244, 63, 94, 0.8)', 'rgba(234, 179, 8, 0.8)', 'rgba(34, 197, 94, 0.8)', 'rgba(168, 85, 247, 0.8)'
            ],
            borderWidth: 1
        }];
    } else {
        datasets = [
            { label: '收文', data: incomingData, backgroundColor: 'rgba(59, 130, 246, 0.8)', borderColor: 'rgba(59, 130, 246, 1)', borderWidth: chartType === 'line' ? 3 : 0, borderRadius: 4, tension: 0.3, fill: false },
            { label: '發文', data: outgoingData, backgroundColor: 'rgba(16, 185, 129, 0.8)', borderColor: 'rgba(16, 185, 129, 1)', borderWidth: chartType === 'line' ? 3 : 0, borderRadius: 4, tension: 0.3, fill: false }
        ];
    }

    let options = {
        responsive: true, maintainAspectRatio: false,
        plugins: {
            legend: { position: chartType === 'pie' ? 'right' : 'top' }
        }
    };

    if (chartType !== 'pie') {
        options.scales = { x: { stacked: isStacked }, y: { stacked: isStacked, beginAtZero: true } };
    } else {
        options.cutout = '50%'; // Make it a doughnut chart
    }

    chartInstance = new Chart(ctx, {
        type: configType,
        data: { labels: labels, datasets: datasets },
        options: options
    });
}

}

function exportDeptStats() {
    if(filteredData.length === 0) return showToast('匯出失敗', '沒有資料', 'error');
    const stats = {};
    filteredData.forEach(item => {
        if (!stats[item.dept]) stats[item.dept] = { incoming: 0, outgoing: 0 };
        if (item.mode === '收文') stats[item.dept].incoming++;
        if (item.mode === '發文') stats[item.dept].outgoing++;
    });
    const exportData = Object.entries(stats).map(([dept, val]) => ({ '部門': dept, '收文': val.incoming, '發文': val.outgoing, '小計': val.incoming + val.outgoing }));
    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '部門統計');
    XLSX.writeFile(wb, `${getReportPeriod()}_部門統計.xlsx`);
}

function exportAnnualMonthlyReport() {
    if (data.length === 0) return showToast('匯出失敗', '沒有資料', 'error');
    
    const yearSelect = document.getElementById('reportYear');
    if (!yearSelect.value) return showToast('匯出失敗', '請先在上方「篩選」區選擇年度', 'error');
    
    const selectedYearTw = parseInt(yearSelect.value.replace('年', ''), 10);
    const selectedYearGregorian = selectedYearTw + 1911;

    // 篩選出符合該年的資料
    const yearData = data.filter(d => {
        return d.uploadYear === selectedYearTw || d.uploadYear === selectedYearGregorian;
    });

    if (yearData.length === 0) return showToast('匯出失敗', `找不到 ${yearSelect.value} 的資料，請確認檔案內容`, 'error');

    // 取得所有部門並排序
    const depts = new Set();
    yearData.forEach(d => { if (d.dept) depts.add(d.dept); });
    
    const order = ["環評部", "永續部", "循環部", "水務部", "能資部", "水利部", "行政部", "職安中心", "研資部", "專案部", "管理部", "資訊部", "業務部"];
    const deptArray = Array.from(depts).sort((a, b) => {
        let idxA = order.indexOf(a);
        let idxB = order.indexOf(b);
        if (idxA === -1) idxA = 999;
        if (idxB === -1) idxB = 999;
        if (idxA !== idxB) return idxA - idxB;
        return a.localeCompare(b);
    });

    // 建立 1 到 12 月的統計表
    const months = Array.from({length: 12}, (_, i) => i + 1);
    const stats = {};
    months.forEach(m => {
        stats[m] = {};
        deptArray.forEach(d => { stats[m][d] = { incoming: 0, outgoing: 0 }; });
        stats[m].total = { incoming: 0, outgoing: 0 };
    });

    // 統計數量
    yearData.forEach(d => {
        const m = d.uploadMonth;
        if (m && stats[m] && stats[m][d.dept]) {
            if (d.mode === '收文') {
                stats[m][d.dept].incoming++;
                stats[m].total.incoming++;
            }
            if (d.mode === '發文') {
                stats[m][d.dept].outgoing++;
                stats[m].total.outgoing++;
            }
        }
    });

    // 轉 Excel 陣列
    const wsData = [];
    const header1 = ["月份"];
    const header2 = [""];
    
    deptArray.forEach(dept => {
        header1.push(dept);
        header1.push("");
        header2.push("收文", "發文");
    });
    header1.push("加總", "", "");
    header2.push("收文", "發文", "小計");
    
    wsData.push(header1);
    wsData.push(header2);

    months.forEach(m => {
        if (stats[m].total.incoming === 0 && stats[m].total.outgoing === 0) return; // 該月無資料則跳過
        
        const rowIndex = wsData.length + 1; // Excel 列索引從 1 開始
        const row = [`${m}月`];
        let inCols = [];
        let outCols = [];
        
        deptArray.forEach((dept, idx) => {
            row.push(stats[m][dept].incoming, stats[m][dept].outgoing);
            
            const inColLetter = XLSX.utils.encode_col(1 + idx * 2);
            const outColLetter = XLSX.utils.encode_col(2 + idx * 2);
            inCols.push(`${inColLetter}${rowIndex}`);
            outCols.push(`${outColLetter}${rowIndex}`);
        });
        
        const inFormula = inCols.length > 0 ? inCols.join('+') : "0";
        const outFormula = outCols.length > 0 ? outCols.join('+') : "0";
        
        const totalInColLetter = XLSX.utils.encode_col(1 + deptArray.length * 2);
        const totalOutColLetter = XLSX.utils.encode_col(2 + deptArray.length * 2);
        const overallTotalFormula = `${totalInColLetter}${rowIndex}+${totalOutColLetter}${rowIndex}`;

        row.push(
            { t: 'n', v: stats[m].total.incoming, f: inFormula },
            { t: 'n', v: stats[m].total.outgoing, f: outFormula },
            { t: 'n', v: stats[m].total.incoming + stats[m].total.outgoing, f: overallTotalFormula }
        );
        wsData.push(row);
    });

    // === 加入底部的「加總」兩列 ===
    const rowInTotal = ["加總"];
    const rowSubTotal = [""];

    let totalInCols = [];
    let totalOutCols = [];
    
    // 計算行數範圍
    const endRow = wsData.length; // 因為前面加入了表頭2列，所以如果是1月到12月，endRow 會是 14。資料列是 3 到 endRow。

    deptArray.forEach((dept, idx) => {
        const inColLetter = XLSX.utils.encode_col(1 + idx * 2);
        const outColLetter = XLSX.utils.encode_col(2 + idx * 2);

        let inSum = 0;
        let outSum = 0;
        months.forEach(m => {
            if (stats[m].total.incoming === 0 && stats[m].total.outgoing === 0) return;
            inSum += stats[m][dept].incoming;
            outSum += stats[m][dept].outgoing;
        });

        rowInTotal.push(
            { t: 'n', v: inSum, f: `SUM(${inColLetter}3:${inColLetter}${endRow})` },
            { t: 'n', v: outSum, f: `SUM(${outColLetter}3:${outColLetter}${endRow})` }
        );
        
        rowSubTotal.push({ t: 'n', v: inSum + outSum, f: `${inColLetter}${endRow+1}+${outColLetter}${endRow+1}` });
        rowSubTotal.push(""); // 預留合併

        totalInCols.push(`${inColLetter}${endRow+1}`);
        totalOutCols.push(`${outColLetter}${endRow+1}`);
    });

    const overallInColLetter = XLSX.utils.encode_col(1 + deptArray.length * 2);
    const overallOutColLetter = XLSX.utils.encode_col(2 + deptArray.length * 2);
    
    let overallInSum = 0;
    let overallOutSum = 0;
    months.forEach(m => {
        if (stats[m].total.incoming === 0 && stats[m].total.outgoing === 0) return;
        overallInSum += stats[m].total.incoming;
        overallOutSum += stats[m].total.outgoing;
    });

    // 最右下角的總計 (恢復原本的結構：明細列3格，總計列合併3格)
    rowInTotal.push(
        { t: 'n', v: overallInSum, f: `SUM(${overallInColLetter}3:${overallInColLetter}${endRow})` },
        { t: 'n', v: overallOutSum, f: `SUM(${overallOutColLetter}3:${overallOutColLetter}${endRow})` },
        { t: 'n', v: overallInSum + overallOutSum, f: `SUM(${overallInColLetter}3:${overallInColLetter}${endRow})+SUM(${overallOutColLetter}3:${overallOutColLetter}${endRow})` }
    );
    rowSubTotal.push({ t: 'n', v: overallInSum + overallOutSum, f: `${overallInColLetter}${endRow+1}+${overallOutColLetter}${endRow+1}` }, "", ""); // 預留合併3格

    wsData.push(rowInTotal);
    wsData.push(rowSubTotal);

    const ws = XLSX.utils.aoa_to_sheet(wsData);

    // 跨欄置中設定
    const merges = [];
    merges.push({ s: { r: 0, c: 0 }, e: { r: 1, c: 0 } });
    
    let colIndex = 1;
    deptArray.forEach(() => {
        merges.push({ s: { r: 0, c: colIndex }, e: { r: 0, c: colIndex + 1 } });
        colIndex += 2;
    });
    merges.push({ s: { r: 0, c: colIndex }, e: { r: 0, c: colIndex + 2 } });
    
    // 跨欄置中 (底部加總)
    const totalRowIdx1 = wsData.length - 2; // rowInTotal 的行索引 (0-indexed)
    const totalRowIdx2 = wsData.length - 1; // rowSubTotal 的行索引 (0-indexed)
    
    // 將 "加總" 跨兩列合併
    merges.push({ s: { r: totalRowIdx1, c: 0 }, e: { r: totalRowIdx2, c: 0 } });
    
    // 對齊調整：底部部門加總橫跨收發兩欄
    let bottomColIndex = 1;
    deptArray.forEach(() => {
        merges.push({ s: { r: totalRowIdx2, c: bottomColIndex }, e: { r: totalRowIdx2, c: bottomColIndex + 1 } });
        bottomColIndex += 2;
    });
    
    // 恢復：右下角最後三欄跨合併 (僅合併最後一列的3格)
    merges.push({ s: { r: totalRowIdx2, c: bottomColIndex }, e: { r: totalRowIdx2, c: bottomColIndex + 2 } });
    
    ws['!merges'] = merges;

    // 設定寬度與列高
    const cols = [{ wch: 12 }]; 
    for(let i = 0; i < deptArray.length * 2; i++) cols.push({ wch: 8 });
    cols.push({ wch: 10 }, { wch: 10 }, { wch: 12 });
    ws['!cols'] = cols;

    const rows = [];
    for(let i = 0; i < wsData.length; i++) {
        // 第一列(明細)與最後一列(總計)設定稍微大一點的高度
        if (i === totalRowIdx1 || i === totalRowIdx2) {
            rows.push({ hpx: 32 }); 
        } else {
            rows.push({ hpx: 26 });
        }
    }
    ws['!rows'] = rows;

    // 寫入樣式
    const range = XLSX.utils.decode_range(ws['!ref']);
    for(let R = range.s.r; R <= range.e.r; ++R) {
        for(let C = range.s.c; C <= range.e.c; ++C) {
            const cellRef = XLSX.utils.encode_cell({r: R, c: C});
            if(!ws[cellRef]) ws[cellRef] = { v: '', t: 's' };
            
            const style = {
                font: { name: "Microsoft JhengHei", sz: 11 },
                alignment: { vertical: "center", horizontal: "center" },
                border: {
                    top: { style: "thin", color: { rgb: "BFBFBF" } },
                    bottom: { style: "thin", color: { rgb: "BFBFBF" } },
                    left: { style: "thin", color: { rgb: "BFBFBF" } },
                    right: { style: "thin", color: { rgb: "BFBFBF" } }
                }
            };
            
            const isHeader = (R === 0 || R === 1);
            const isTotalRow1 = (R === range.e.r - 1);
            const isTotalRow2 = (R === range.e.r);
            const isTotalCol = (C >= range.e.c - 2); // 總計區塊(最後3欄)
            
            if (isHeader) {
                style.font.bold = true;
                if (R === 0) {
                    style.fill = { fgColor: { rgb: isTotalCol ? "C65911" : "203764" } }; 
                    style.font.color = { rgb: "FFFFFFFF" };
                } else { 
                    style.fill = { fgColor: { rgb: isTotalCol ? "F4B084" : "D9E1F2" } }; 
                }
            } else if (isTotalRow1 || isTotalRow2) {
                // 建議一：統一邏輯法（橙色 L 型包圍）
                style.numFmt = "#,##0";
                style.font.color = { rgb: "000000" }; // 統一黑字
                style.fill = { fgColor: { rgb: isTotalCol ? "F4B084" : "FCE4D6" } }; // 全部套用橘色系，最右下角的終極總計稍微加深
                
                // 加粗頂部分隔線 (區隔資料與加總)
                if (isTotalRow1) {
                    style.border.top = { style: "medium", color: { rgb: "E89A6C" } }; // 橘色系的邊框
                }

                if (isTotalRow1) {
                    style.font.sz = 11;
                    style.font.bold = false;
                    // 第一列的左側標籤與右側小計加粗
                    if (C === 0 || C === range.e.c) {
                        style.font.bold = true;
                    }
                } else if (isTotalRow2) {
                    style.font.sz = 12;
                    style.font.bold = true;
                }
            } else {
                style.numFmt = "#,##0";
                if (C === 0) {
                    style.fill = { fgColor: { rgb: "D9E1F2" } };
                    style.font.bold = true;
                } else if (isTotalCol) {
                    style.fill = { fgColor: { rgb: "FFF2CC" } }; // 總計欄位淡黃底色
                    if (C === range.e.c) style.font.bold = true; 
                } else {
                    style.fill = { fgColor: { rgb: R % 2 === 0 ? "F8FAFC" : "FFFFFFFF" } }; 
                }
            }
            
            ws[cellRef].s = style;
        }
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `${yearSelect.value}各月總表`);
    XLSX.writeFile(wb, `${yearSelect.value}各部門收發文月報表.xlsx`);
    showToast('匯出成功', '年度月報表已下載', 'success');
}

    const encodeMime = (text) => `=?utf-8?B?${btoa(unescape(encodeURIComponent(text)))}?=`;
    const encodeEmails = (emailStr) => {
        if (!emailStr) return '';
        return emailStr.split(',').map(s => {
            const match = s.trim().match(/^(.*?)(<.*>)$/);
            if (match) {
                const name = match[1].trim();
                const mail = match[2].trim();
                return name ? `${encodeMime(name)} ${mail}` : mail;
            }
            return s.trim();
        }).join(', ');
    };

    let toSetting = '';
    let ccSetting = '';
    try {
        const saved = localStorage.getItem('mailSettings');
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.to !== undefined) toSetting = parsed.to;
            if (parsed.cc !== undefined) ccSetting = parsed.cc;
        }
    } catch(e) {}
    
    const to = encodeEmails(toSetting);
    const cc = encodeEmails(ccSetting);
    const actualSubject = `${currYearTw}年${currMonth}月份收發文量，請卓參。`;
    const subjEncoded = encodeMime(actualSubject);

    const emlContent = `To: ${to}\r\nCc: ${cc}\r\nSubject: ${subjEncoded}\r\nX-Unsent: 1\r\nContent-Type: text/html; charset="utf-8"\r\n\r\n${htmlBody}`;

    const blob = new Blob([emlContent], { type: 'message/rfc822' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `主管信件_${currYearTw}年${currMonth}月.eml`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showToast('匯出成功', '主管信件草稿(EML)已自動下載，點擊開啟', 'success');
}

                    <th style="border: 1px solid #000; padding: 10px; font-weight: bold;">小計</th>
                </tr>
            </thead>
            <tbody>
    `;

    // 擷取 tbody 內容
    for (let row of tbody.rows) {
        if (row.cells.length < 4) continue;
        html += `<tr>`;
        for (let cell of row.cells) {
            html += `<td style="border: 1px solid #000; padding: 8px;">${cell.textContent.trim()}</td>`;
        }
        html += `</tr>`;
    }

    // 擷取 tfoot 內容
    for (let row of tfoot.rows) {
        html += `<tr style="font-weight: bold; background-color: #f1f5f9;">`;
        for (let cell of row.cells) {
            html += `<td style="border: 1px solid #000; padding: 10px;">${cell.textContent.trim()}</td>`;
        }
        html += `</tr>`;
    }

    html += `
            </tbody>
        </table>

    `;

    // 同時建立純文字版本
    let text = `${prefix}各部門收發文統計\n`;
    text += `部門\t收文\t發文\t小計\n`;
    for (let row of tbody.rows) {
        if (row.cells.length < 4) continue;
        text += Array.from(row.cells).map(c => c.textContent.trim()).join('\t') + '\n';
    }
    for (let row of tfoot.rows) {
        text += Array.from(row.cells).map(c => c.textContent.trim()).join('\t') + '\n';
    }

    try {
        const clipboardItem = new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([text], { type: 'text/plain' })
        });
        await navigator.clipboard.write([clipboardItem]);
        showToast('複製成功', '真實表格已存入剪貼簿，可直接貼上 Excel、Word 或信件中');
    } catch (err) {
        console.error(err);
        showToast('複製失敗', '瀏覽器拒絕存取剪貼簿，或不支援此功能', 'error');
    }
}

async function copyChart() {
    try {
        const canvas = document.getElementById('deptChart');
        if (!chartInstance) return showToast('複製失敗', '沒有圖表可複製', 'error');
        
        // 1. 建立一個新的暫存 Canvas
        const tempCanvas = document.createElement('canvas');
        const ctx = tempCanvas.getContext('2d');
        const titleHeight = 80;
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height + titleHeight;
        
        // 3. 填滿純白背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        
        // 4. 畫上文字標題
        const fontSize = Math.max(22, canvas.width * 0.03); // 自動適應螢幕解析度的字體大小
        ctx.font = `bold ${fontSize}px "Microsoft JhengHei", sans-serif`;
        ctx.fillStyle = '#1e293b';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // 根據目前選單加上圖表類型名稱與自訂月份
        const typeName = chartType === 'line' ? '折線圖' : '堆疊長條圖';
        const period = getReportPeriod();
        const prefix = period ? period + ' ' : '';
        ctx.fillText(`${prefix}各部門收發文量分布 (${typeName})`, tempCanvas.width / 2, titleHeight / 2 + (fontSize * 0.1));
        
        // 5. 將原本的圖表疊加到標題下方
        ctx.drawImage(canvas, 0, titleHeight);

        // 6. 轉成圖片 Blob 並複製
        tempCanvas.toBlob(async (blob) => {
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                showToast('複製成功', '圖表已複製到剪貼簿\n(含標題與白底，可直接貼上)');
            } catch(clipboardErr) {
                console.error(clipboardErr);
                showToast('複製失敗', '瀏覽器拒絕存取剪貼簿，或不支援此功能', 'error');
            }
        });
    } catch (err) {
        console.error(err);
        showToast('複製失敗', '處理圖表時發生異常', 'error');
    }
}

// 初始化與讀取暫存
async function initializeApp() {
    const loginPage = document.getElementById('loginPage');
    const mainApp = document.getElementById('mainApp');
    const loadingScreen = document.getElementById('loadingScreen');

    if (localStorage.getItem('isLoggedIn') === 'true') {
        loginPage.classList.add('hidden');
        loginPage.classList.remove('flex');
        mainApp.classList.remove('hidden');
        const mainNav = document.getElementById('mainNav');
        if (mainNav) mainNav.classList.remove('hidden');
        const dept = localStorage.getItem('userDept');
        const name = localStorage.getItem('userName');
        const navUserName = document.getElementById('navUserName');
        if (dept && name) {
            let displayName = name;
            if (!displayName.startsWith(dept)) {
                displayName = `${dept} ${name}`;
            }
            if (navUserName) navUserName.textContent = displayName;
        } else {
            if (navUserName) navUserName.textContent = `使用者`;
        }
    } else {
        loginPage.classList.remove('hidden');
        loginPage.classList.add('flex');
        mainApp.classList.add('hidden');
        const mainNav = document.getElementById('mainNav');
        if (mainNav) mainNav.classList.add('hidden');
    }
    
    if (loadingScreen) {
        loadingScreen.classList.remove('hidden');
        loadingScreen.classList.add('flex');
        loadingScreen.innerHTML = '<div class="text-white text-xl font-bold flex flex-col items-center"><div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-4"></div>正在與雲端資料庫連線...</div>';
    }

    try {
        const loadedData = loadDocDataFromLocal();
        if (loadedData) {
            data = loadedData;
            
            // 背景默默同步雲端資料，不卡住畫面
            fetchDataFromCloud().then(cloudData => {
                if (cloudData && Array.isArray(cloudData) && cloudData.length > 0) {
                    const cleanData = deduplicateData(cloudData);
                    // 為了避免頻繁無意義刷新，只在筆數不同時才強制更新畫面 (您也可以選擇每次都更新)
                    if (cleanData.length !== data.length) {
                        data = cleanData;
                        saveDocDataToLocal();
                        updateOverviewStats();
                        renderFilters();
                        filterData();
                        showToast('🔄 資料已自動同步', '已為您自動更新雲端的最新資料', 'info');
                    }
                }
            });
        } else {
            const cloudData = await fetchDataFromCloud();
            if (cloudData && Array.isArray(cloudData)) {
                data = deduplicateData(cloudData);
                saveDocDataToLocal();
            }
        }
        
        let migrated = false;
        data.forEach(d => {
            if (d.dept === '水利防災部') {
                d.dept = '水利部';
                migrated = true;
            }
        });
        if (migrated) {
            saveDocDataToLocal();
            syncDataToCloud();
        }
        
        const inInfo = localStorage.getItem('incomingInfo');
        if (inInfo) {
            const parsed = JSON.parse(inInfo);
            setFileInfo('收文', parsed.filename, parsed.timeStr);
        }
        const outInfo = localStorage.getItem('outgoingInfo');
        if (outInfo) {
            const parsed = JSON.parse(outInfo);
            setFileInfo('發文', parsed.filename, parsed.timeStr);
        }
    } catch(err) {
        console.error("Initialization failed", err);
    }

    if (loadingScreen) {
        setTimeout(() => {
            loadingScreen.classList.add('hidden');
            loadingScreen.classList.remove('flex');
        }, 300);
    }
    init();

    // 啟動背景自動輪詢 (每 3 分鐘檢查一次雲端是否有新資料)
    setInterval(() => {
        if (localStorage.getItem('isLoggedIn') === 'true' && GAS_URL) {
            fetchDataFromCloud().then(cloudData => {
                if (cloudData && Array.isArray(cloudData) && cloudData.length > 0) {
                    const cleanData = deduplicateData(cloudData);
                    if (cleanData.length !== data.length) {
                        data = cleanData;
                        saveDocDataToLocal();
                        updateOverviewStats();
                        renderFilters();
                        filterData();
                        showToast('🔄 發現新資料', '已為您在背景自動同步最新雲端資料', 'info');
                    }
                }
            }).catch(e => console.error("Background sync failed", e));
        }
    }, 180000); // 180,000 毫秒 = 3 分鐘
}

    a.click();

}

function importJson(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if (!Array.isArray(importedData)) throw new Error("JSON 格式不正確");
            const confirmResult = await Swal.fire({
                title: '確認匯入？',
                text: `準備匯入 ${importedData.length} 筆資料。這會「合併」到目前的資料庫中（遇到重複字號會自動跳過），確定要繼續嗎？`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: '確定合併',
                cancelButtonText: '取消'
            });
            if (!confirmResult.isConfirmed) {
                event.target.value = ""; 
                return;
            }
            const existingKeys = new Set(data.map(d => `${d.mode}_${d.docNo}`));
            let added = 0;
            importedData.forEach(d => {
                if (d && d.mode && d.docNo) {
                    const key = `${d.mode}_${d.docNo}`;
                    if(!existingKeys.has(key)) {
                        data.push(d);
                        existingKeys.add(key);
                        added++;
                    }
                }
            });
            saveDocDataToLocal();
            syncDataToCloud();
            const now = new Date();
            const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            setFileInfo('收文', 'JSON 檔案還原匯入', timeStr);
            setFileInfo('發文', 'JSON 檔案還原匯入', timeStr);
            init();
            Swal.fire('匯入成功', `成功合併 ${added} 筆新資料！\n(跳過了 ${importedData.length - added} 筆重複資料)`, 'success');
        } catch (error) {
            console.error(error);
            Swal.fire('匯入失敗', '讀取 JSON 檔案時發生錯誤，請確認檔案格式是否正確。', 'error');
        } finally {
            event.target.value = "";
        }
    };
    reader.readAsText(file);
}
